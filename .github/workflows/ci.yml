# Type-check and build the plugin, smoke-test the built files, and test install.ps1 on Windows PowerShell 5.1.
# Windows: windows-latest is Windows Server 2025 and windows-2022 is Windows Server 2022 (no
# Windows 10 or 11 client); they run the unit and smoke tests with the real hidden-file rules
# and attrib.exe, the installer test and the hidden-folder test.
name: ci
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: python3 -m py_compile server/vlb
      - name: Smoke test (main.js and app.js load, lock and stop)
        run: npm test
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Unit and smoke tests (no server round trip on Windows)
        run: npm run test:win
      - name: Test install.ps1
        shell: powershell
        run: ./scripts/test-install.ps1
      - name: Test hiding the private folder
        shell: powershell
        run: ./scripts/test-hide.ps1
