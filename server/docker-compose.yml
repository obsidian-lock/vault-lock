# Server side of the Obsidian "Vault Lock" plugin, in /opt/obsidian-webdav.
#   webdav: the backup. Each paired computer has its own login and sees only its own
#           folder, data/devices/<folder>/ (the vault as plain files, _manifest.json,
#           _trash/, _control/).
#   pair:   the pairing inbox at /_pair/. Its public login can only create small files,
#           and only while pairing is open.
# Both configs are generated by `vlb` (see vlb help); don't edit them by hand.
# The image is pinned so a pull never changes behaviour by surprise.
# The container logs hold one line per request with the client address and login; `vlb
# process` reads them every minute to show where each computer connects from, so they are
# capped here (100 MB per container) instead of growing forever.
services:
  webdav:
    image: ghcr.io/hacdias/webdav:v5.17.2
    container_name: obsidian-webdav
    restart: unless-stopped
    command: ["-c", "/conf/config.json"]
    volumes:
      - ./conf/webdav:/conf:ro
      - ./data:/data
    networks:
      - edge          # the Docker network your reverse proxy is on
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  pair:
    image: ghcr.io/hacdias/webdav:v5.17.2
    container_name: obsidian-pair
    restart: unless-stopped
    command: ["-c", "/conf/config.json"]
    volumes:
      - ./conf/pair:/conf:ro
      - ./inbox:/inbox
    networks:
      - edge
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

networks:
  edge:
    external: true
    name: edge        # <- replace with that network's actual name
